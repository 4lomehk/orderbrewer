<style>

:root[data-theme="dark"]{--bg:#141413;--fg:#f4f1ea;--mut:#a8a399;--card:#1f1e1c;--line:#34322e;--acc:#e08a6b;--bad:#ef7b6c;color-scheme:dark}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}

.seg button.on{background:var(--fg);color:var(--bg)}

.hero{text-align:center;padding:22px 0 8px}
.mw{position:relative;width:120px;margin:0 auto}

h1{font-size:25px;font-weight:900;line-height:1.2;margin-top:12px}
.sub{color:var(--mut);margin-top:4px}

@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}

.prog{display:flex;gap:6px;margin:12px 0 4px}
.prog div{flex:1;font-size:12px;color:var(--mut);font-weight:700}

.prog div.on{color:var(--fg)}.prog div.on::before{background:var(--acc)}
.shop{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin:10px 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut)}.dot.ok{background:var(--ok)}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.lab{font-size:12px;color:var(--mut);margin:10px 0 6px;font-weight:700}

.chip:active{transform:scale(.96)}

.chip small{display:block;font-weight:500;font-size:12px;opacity:.8}
